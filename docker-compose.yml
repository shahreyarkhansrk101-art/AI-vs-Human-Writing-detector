services:
  ai-text-api:
    build: .
    container_name: ai-text-detector-api
    ports:
      - "8000:8000"
    volumes:
      - models_data:/app/models
      - results_data:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build: ./frontend
    container_name: ai-text-detector-dashboard
    ports:
      - "3000:80"
    depends_on:
      - ai-text-api
    restart: unless-stopped

volumes:
  models_data:
  results_data:
